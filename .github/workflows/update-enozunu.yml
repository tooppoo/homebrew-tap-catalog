name: Update enozunu Formula

on:
  workflow_dispatch:
    inputs:
      version:
        description: "enozunu version to publish, e.g. 0.3.1"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    uses: ./.github/workflows/reusable-formula-update.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      formula: enozunu
      repository: tooppoo/enozunu
      version: ${{ inputs.version }}
      # enozunu tags its releases without a leading "v".
      tag_prefix: ""
