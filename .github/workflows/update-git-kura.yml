name: Update git-kura Formula

on:
  workflow_dispatch:
    inputs:
      version:
        description: "git-kura version to publish, e.g. 0.1.3 or v0.1.3"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    uses: ./.github/workflows/reusable-formula-update.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      formula: git-kura
      repository: tooppoo/git-kura
      version: ${{ inputs.version }}
      tag_prefix: v
